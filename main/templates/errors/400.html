<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Неверный запрос</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1c1a0f 0%, #1f1c12 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" opacity="0.08"><path fill="none" stroke="%23d4a54f" stroke-width="1.2" d="M200,100 L350,180 L500,120 L620,190 L740,140"/><circle cx="350" cy="180" r="4" fill="%23d4a54f"/><circle cx="580" cy="270" r="4" fill="%23d4a54f"/></svg>');
            background-repeat: repeat;
            background-size: 180px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(212, 165, 79, 0.12) 0%, rgba(5, 10, 25, 0.7) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .error-container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 100%;
            background: rgba(28, 26, 15, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(212, 165, 79, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            padding: 40px 32px 48px;
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 100px;
            padding: 8px 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(212, 165, 79, 0.6);
        }
        .code {
            font-size: 1.2rem;
            font-weight: 600;
            color: #d4a54f;
            background: #1f1c12;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: monospace;
        }
        h1 {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #d4a54f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        .glow-text {
            font-size: 1.1rem;
            color: #ffd9a5;
            margin-bottom: 24px;
            border-left: 3px solid #d4a54f;
            padding-left: 18px;
            text-align: left;
        }
        .footer-note {
            margin-top: 32px;
            text-align: center;
            font-size: 0.7rem;
            color: #8a7a5f;
            border-top: 1px solid rgba(212, 165, 79, 0.2);
            padding-top: 18px;
        }
        @media (max-width: 550px) {
            h1 { font-size: 3rem; }
            .error-container { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="badge">
            <div class="code">{{ error_code }}</div>
            <span>{{ error_name }}</span>
        </div>
        <h1>{{ error_title }}</h1>
        <div class="glow-text">{{ error_message }}</div>
        <div class="footer-note">• неверный запрос • проверьте данные • код {{ error_code }} •</div>
    </div>
</body>
</html>
